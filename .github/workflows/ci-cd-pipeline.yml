name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      log_errors:
        description: 'Generate error logs on test failure (manual run)'
        required: false
        default: "false"

env:
  COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
  COINMARKETCAP_SYMBOLS: "BTC"
  UPDATE_FREQ_SEC: 60

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      tests_result: ${{ steps.test_outcome.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          pip install uv
          uv sync --extra dev
      
      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          echo "Running tests..."
          uv run pytest src/tests/ -v

      - name: Set test outcome
        id: test_outcome
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ Tests completed successfully!"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "❌ Tests failed"
          fi

  error_logs:
    name: Generate Error Logs
    needs: test
    if: needs.test.outputs.tests_result == 'failure' && github.event.inputs.log_errors == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          pip install uv
          uv sync --extra dev
      
      - name: Generate error logs
        run: |
          echo "=== Test Failure Report ===" > error.log
          echo "Timestamp: $(date)" >> error.log
          echo "Branch: ${{ github.ref }}" >> error.log
          echo "Commit: ${{ github.sha }}" >> error.log
          echo "" >> error.log
          uv run pytest src/tests/ --tb=long >> error.log 2>&1

      - name: Upload error logs
        uses: actions/upload-artifact@v4
        with:
          name: test-error-logs-${{ github.run_number }}
          path: error.log

  build:
    name: Build and Push Docker Image
    needs: test
    if: needs.test.outputs.tests_result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/crypto-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate Azure secrets
        run: |
          if [ -z "${{ secrets.AZURE_SCM_URL }}" ]; then
            echo "❌ AZURE_SCM_URL secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
            echo "❌ AZURE_WEBAPP_NAME secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "❌ AZURE_CREDENTIALS secret not configured"
            exit 1
          fi
          
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            echo "❌ AZURE_RESOURCE_GROUP secret not configured"
            exit 1
          fi
          
          echo "✅ Azure secrets are configured"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Azure Publish Profile
        id: publish_profile
        run: |
          # Get publishing credentials using Azure CLI
          PUBLISH_PROFILE=$(az webapp deployment list-publishing-credentials --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }})
          
          PUBLISH_USERNAME=$(echo $PUBLISH_PROFILE | jq -r '.publishingUserName')
          PUBLISH_PASSWORD=$(echo $PUBLISH_PROFILE | jq -r '.publishingPassword')
          
          echo "::add-mask::$PUBLISH_PASSWORD"
          echo "username=$PUBLISH_USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PUBLISH_PASSWORD" >> $GITHUB_OUTPUT

      - name: Trigger Azure Container Refresh
        run: |
          echo "🚀 Triggering Azure Docker webhook..."
          
          # Store response in temporary file
          curl -s -w "HTTPSTATUS:%{http_code}" \
            -u "${{ steps.publish_profile.outputs.username }}:${{ steps.publish_profile.outputs.password }}" \
            -X POST \
            "https://${{ secrets.AZURE_SCM_URL }}/docker/hook?site=${{ secrets.AZURE_WEBAPP_NAME }}" \
            -o /tmp/response.txt
          
          # Extract HTTP status code
          http_code=$(grep -o "HTTPSTATUS:[0-9]*" /tmp/response.txt | cut -d: -f2)
          response_body=$(sed 's/HTTPSTATUS:[0-9]*$//' /tmp/response.txt)
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 202 ]; then
            echo "✅ Azure Docker webhook triggered successfully (HTTP $http_code)"
            echo "Docker image pull initiated from Docker Hub"
          else
            echo "❌ Docker webhook failed with HTTP code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 45 seconds for Docker image pull and container refresh..."
          sleep 45
          echo "🎉 Docker deployment should be complete!"
          echo "🌐 Check your app: https://app-crypto-dashboard-b8bacgegd5btexhz.swedencentral-01.azurewebsites.net/"
